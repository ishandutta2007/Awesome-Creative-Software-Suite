<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
      }
      .metric-desc {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #94a3b8;
      }
      /* Animated dynamic pulse and floating elements */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 30px) scale(1.1); }
      }
      @keyframes cardFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseRing {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      .dynamic-orb-1 {
        animation: floatOrb1 12s ease-in-out infinite;
      }
      .dynamic-orb-2 {
        animation: floatOrb2 15s ease-in-out infinite;
      }
      .dynamic-card-1 {
        animation: cardFloat 6s ease-in-out infinite;
      }
      .dynamic-card-2 {
        animation: cardFloat 7s ease-in-out infinite 1s;
      }
      .dynamic-card-3 {
        animation: cardFloat 6.5s ease-in-out infinite 2s;
      }
      .dynamic-flow-line {
        stroke-dasharray: 6 6;
        animation: pulseRing 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (In background) -->
  <g filter="url(#glowBlur)">
    <circle class="dynamic-orb-1" cx="220" cy="110" r="130" fill="#6366f1" opacity="0.45" />
    <circle class="dynamic-orb-2" cx="980" cy="280" r="150" fill="#ec4899" opacity="0.38" />
    <circle class="dynamic-orb-1" cx="620" cy="340" r="110" fill="#06b6d4" opacity="0.32" />
  </g>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Subtle dynamic wave / connector lines in background -->
  <path class="dynamic-flow-line" d="M 100 350 C 350 260, 600 420, 1100 320" fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.45" />
  <path class="dynamic-flow-line" d="M 120 70 C 450 150, 750 20, 1080 90" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.35" />

  <!-- Creative Nodes / Flow Diagram Background Accents -->
  <g opacity="0.6">
    <circle cx="150" cy="70" r="4" fill="#38bdf8" />
    <circle cx="1050" cy="90" r="4" fill="#f472b6" />
    <circle cx="180" cy="340" r="4" fill="#818cf8" />
    <circle cx="1020" cy="330" r="4" fill="#34d399" />
  </g>

  <!-- Content Group (Foreground guaranteed) -->
  <g>
    <!-- Top Category Badge Pill -->
    <g transform="translate(430, 48)">
      <rect width="340" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="17" r="6" fill="#10b981" />
      <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
        🎨 CURATED CREATIVE ECOSYSTEM • 2026
      </text>
    </g>

    <!-- Main Title (Gradient Foreground) -->
    <text x="600" y="140" text-anchor="middle" class="title-text" fill="url(#textGrad)">
      Awesome Creative Software Suite
    </text>

    <!-- Subtitle (Clear, readable foreground) -->
    <text x="600" y="180" text-anchor="middle" class="subtitle-text">
      The Ultimate Index of SaaS Powerhouses &amp; Production-Ready Open-Source Suites
    </text>

    <!-- Category Pills Row -->
    <g transform="translate(190, 212)">
      <!-- Pill 1: Vector & UI -->
      <g transform="translate(0, 0)">
        <rect width="135" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
        <text x="67" y="20" text-anchor="middle" class="tag-text">✨ Vector &amp; UI/UX</text>
      </g>
      <!-- Pill 2: 3D & Animation -->
      <g transform="translate(150, 0)">
        <rect width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
        <text x="75" y="20" text-anchor="middle" class="tag-text">🧊 3D &amp; Animation</text>
      </g>
      <!-- Pill 3: Photo & RAW -->
      <g transform="translate(315, 0)">
        <rect width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
        <text x="75" y="20" text-anchor="middle" class="tag-text">📸 Photo &amp; RAW Lab</text>
      </g>
      <!-- Pill 4: Video & VFX -->
      <g transform="translate(480, 0)">
        <rect width="145" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
        <text x="72" y="20" text-anchor="middle" class="tag-text">🎬 Video Editing</text>
      </g>
      <!-- Pill 5: Open Source -->
      <g transform="translate(640, 0)">
        <rect width="175" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
        <text x="87" y="20" text-anchor="middle" class="tag-text">🚀 100% Free &amp; Open</text>
      </g>
    </g>

    <!-- Bottom Metric / Feature Cards (Floating gently) -->
    <!-- Card 1 -->
    <g class="dynamic-card-1" transform="translate(170, 275)">
      <rect width="250" height="85" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
      <rect width="36" height="36" rx="8" x="18" y="24" fill="#38bdf8" fill-opacity="0.15" />
      <text x="36" y="48" font-size="20" text-anchor="middle">⚡</text>
      <text x="66" y="44" class="metric-title" fill="#38bdf8">SaaS Market Giants</text>
      <text x="66" y="66" class="metric-desc">Market cap &amp; transparent tier pricing</text>
    </g>

    <!-- Card 2 -->
    <g class="dynamic-card-2" transform="translate(475, 275)">
      <rect width="250" height="85" rx="14" fill="url(#cardGrad2)" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.2" />
      <rect width="36" height="36" rx="8" x="18" y="24" fill="#f43f5e" fill-opacity="0.15" />
      <text x="36" y="48" font-size="20" text-anchor="middle">⭐</text>
      <text x="66" y="44" class="metric-title" fill="#f472b6">Star-Ranked FOSS</text>
      <text x="66" y="66" class="metric-desc">Verified community star badges &amp; repos</text>
    </g>

    <!-- Card 3 -->
    <g class="dynamic-card-3" transform="translate(780, 275)">
      <rect width="250" height="85" rx="14" fill="url(#cardGrad3)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <rect width="36" height="36" rx="8" x="18" y="24" fill="#10b981" fill-opacity="0.15" />
      <text x="36" y="48" font-size="20" text-anchor="middle">🔓</text>
      <text x="66" y="44" class="metric-title" fill="#34d399">Production Ready</text>
      <text x="66" y="66" class="metric-desc">Offline, self-hostable &amp; zero lock-in</text>
    </g>

  </g>
</svg>
