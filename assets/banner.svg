px;fill:#94a3b8;letter-spacing:.5px}.metric-desc,.metric-title,.subtitle-text,.tag-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.tag-text{font-weight:600;font-size:13px;fill:#e2e8f0}.metric-title{font-weight:700;font-size:15px}.metric-desc{font-weight:400;font-size:12px;fill:#94a3b8}.dynamic-orb-1{animation:floatOrb1 12s ease-in-out infinite}.dynamic-orb-2{animation:floatOrb2 15s ease-in-out infinite}.dynamic-card-1{animation:cardFloat 6s ease-in-out infinite}.dynamic-card-2{animation:cardFloat 7s ease-in-out infinite 1s}.dynamic-card-3{animation:cardFloat 6.5s ease-in-out infinite 2s}.dynamic-flow-line{stroke-dasharray:6 6;animation:pulseRing 3s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><g filter="url(#glowBlur)"><circle cx="220" cy="110" r="130" fill="#6366f1" class="dynamic-orb-1" opacity=".45"/><circle cx="980" cy="280" r="150" fill="#ec4899" class="dynamic-orb-2" opacity=".38"/><circle cx="620" cy="340" r="110" fill="#06b6d4" class="dynamic-orb-1" opacity=".32"/></g><rect width="100%" height="100%" fill="url(#grid)"/><path fill="none" stroke="#6366f1" stroke-width="1.8" d="M 100 350 C 350 260, 600 420, 1100 320" class="dynamic-flow-line" opacity=".45"/><path fill="none" stroke="#ec4899" stroke-width="1.5" d="M 120 70 C 450 150, 750 20, 1080 90" class="dynamic-flow-line" opacity=".35"/><g opacity=".6"><circle cx="150" cy="70" r="4" fill="#38bdf8"/><circle cx="1050" cy="90" r="4" fill="#f472b6"/><circle cx="180" cy="340" r="4" fill="#818cf8"/><circle cx="1020" cy="330" r="4" fill="#34d399"/></g><g><g transform="translate(430, 48)"><rect width="340" height="34" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="17"/><circle cx="20" cy="17" r="6" fill="#10b981"/><text x="36" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing=".5">🎨 CURATED CREATIVE ECOSYSTEM • 2026</text></g><text x